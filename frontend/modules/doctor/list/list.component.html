<div class="container mt-4">
  <h2>Doctor List</h2>

  <button class="btn btn-primary mb-3" (click)="onAdd()">Add Doctor</button>

  <table class="table table-hover table-bordered table-striped">
    <thead>
      <tr>
        <th style="width: 10%;">ID</th>
        <th style="width: 20%;">Name</th>
        <th style="width: 20%;">Specialization</th>
        <th style="width: 25%;">Email</th>
        <th style="width: 25%;">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let doc of doctors">
        <td>{{ doc.id }}</td>
        <td>{{ doc.name }}</td>
        <td>{{ doc.specialization }}</td>
        <td>{{ doc.email }}</td>
        <td>
          <button class="btn btn-warning btn-sm" (click)="onEdit(doc.id)">
            Edit
          </button>
          <button class="btn btn-danger btn-sm" (click)="onDelete(doc.id)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="doctors.length === 0" class="alert alert-info">
    No doctors found.
  </div>
</div>
