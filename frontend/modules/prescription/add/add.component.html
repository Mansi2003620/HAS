<div class="container mt-4">
  <div class="card p-4 shadow-sm rounded">
    <h2 class="text-center mb-4">Add Prescription</h2>

    <form (ngSubmit)="onSubmit()" #prescriptionForm="ngForm">

      <!-- Prescription Details -->
      <div class="mb-3">
        <label class="form-label">Medicine Name</label>
        <input
          type="text"
          [(ngModel)]="prescription.medicineName"
          name="medicineName"
          class="form-control"
          placeholder="Enter medicine name"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Dosage</label>
        <input
          type="text"
          [(ngModel)]="prescription.dosage"
          name="dosage"
          class="form-control"
          placeholder="Enter dosage (e.g. 1 tablet twice daily)"
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Duration / Instructions</label>
        <textarea
          [(ngModel)]="prescription.duration"
          name="duration"
          class="form-control"
          placeholder="Enter special instructions"
          rows="3"
        ></textarea>
      </div>

      <div class="text-center">
        <button
          type="submit"
          class="btn btn-success px-4"
          [disabled]="!prescriptionForm.valid"
        >
          Add Prescription
        </button>
      </div>

    </form>
  </div>
</div>
