<div class="container">
  <h2>User List</h2>

  <button class="btn btn-primary mb-3" (click)="onAdd()">Add User</button>

  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <button class="btn btn-warning btn-sm" (click)="onEdit(user.id)">
            Edit
          </button>
          <button class="btn btn-danger btn-sm" (click)="onDelete(user.id)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="users.length === 0" class="alert alert-info">
    No users found.
  </div>
</div>
