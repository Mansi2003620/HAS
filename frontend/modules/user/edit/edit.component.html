<div class="container mt-4">
  <h2>Edit User</h2>
  <form (ngSubmit)="onUpdate()">
    <div class="mb-3">
      <label>Name</label>
      <input type="text" [(ngModel)]="user.name" name="name" class="form-control" required />
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" [(ngModel)]="user.email" name="email" class="form-control" required />
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input type="password" [(ngModel)]="user.password" name="password" class="form-control" />
    </div>

    <div class="mb-3">
      <label>Role</label>
      <select [(ngModel)]="user.role" name="role" class="form-control">
        <option value="DOCTOR">Doctor</option>
        <option value="PATIENT">Patient</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Update</button>
    <button type="button" (click)="goBack()" class="btn btn-secondary ms-2">Cancel</button>
  </form>
</div>
