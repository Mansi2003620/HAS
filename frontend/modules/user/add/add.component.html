<div class="container mt-4">
  <h2 class="text-center mb-4">Add User</h2>

  <form (ngSubmit)="onSubmit()" #userForm="ngForm" class="card p-4 shadow-sm rounded">

    <!-- User Basic Info -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="name" class="form-label">Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          class="form-control"
          required
          [(ngModel)]="user.name"
        />
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          required
          [(ngModel)]="user.email"
        />
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="password" class="form-label">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          required
          [(ngModel)]="user.password"
        />
      </div>
      <div class="col-md-6">
        <label for="role" class="form-label">Role:</label>
        <select
          id="role"
          name="role"
          class="form-select"
          required
          [(ngModel)]="user.role"
        >
          <option value="">-- Select Role --</option>
          <option value="PATIENT">Patient</option>
          <option value="DOCTOR">Doctor</option>
        </select>
      </div>
    </div>

    <!-- Conditional Fields: Patient -->
    <div *ngIf="user.role === 'PATIENT'" class="border rounded p-3 mb-3 bg-light">
      <h5>Patient Details</h5>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="age" class="form-label">Age:</label>
          <input
            type="number"
            id="age"
            name="age"
            class="form-control"
            [(ngModel)]="patient.age"
          />
        </div>
        <div class="col-md-6">
          <label for="gender" class="form-label">Gender:</label>
          <select
            id="gender"
            name="gender"
            class="form-select"
            [(ngModel)]="patient.gender"
          >
            <option value="">-- Select Gender --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="phone" class="form-label">Phone:</label>
          <input
            type="text"
            id="phone"
            name="phone"
            class="form-control"
            [(ngModel)]="patient.phone"
          />
        </div>
        <div class="col-md-6">
          <label for="address" class="form-label">Address:</label>
          <input
            type="text"
            id="address"
            name="address"
            class="form-control"
            [(ngModel)]="patient.address"
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="medicalHistory" class="form-label">Medical History:</label>
        <textarea
          id="medicalHistory"
          name="medicalHistory"
          class="form-control"
          rows="3"
          [(ngModel)]="patient.medicalHistory"
        ></textarea>
      </div>
    </div>

    <!-- Conditional Fields: Doctor -->
    <div *ngIf="user.role === 'DOCTOR'" class="border rounded p-3 mb-3 bg-light">
      <h5>Doctor Details</h5>
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="specialization" class="form-label">Specialization:</label>
          <input
            type="text"
            id="specialization"
            name="specialization"
            class="form-control"
            [(ngModel)]="doctor.specialization"
          />
        </div>
        <div class="col-md-6">
          <label for="experience" class="form-label">Experience (in years):</label>
          <input
            type="number"
            id="experience"
            name="experience"
            class="form-control"
            [(ngModel)]="doctor.experience"
          />
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="text-center">
      <button
        type="submit"
        class="btn btn-primary px-4"
        [disabled]="!userForm.form.valid"
      >
        Submit
      </button>
    </div>
  </form>
</div>
