<div class="container mt-4">
  <div class="card p-4 shadow-sm rounded">
    <h2 class="text-center mb-4">Edit Patient</h2>

    <form (ngSubmit)="onUpdate()" #editPatientForm="ngForm">

      <!--  User Details -->
      <h5 class="mb-3 text-primary">User Details</h5>
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" [(ngModel)]="patient.name" name="name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="patient.email" name="email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" [(ngModel)]="patient.phone" name="phone">
      </div>

      <!-- 🩺 Patient Details -->
      <h5 class="mb-3 text-primary">Patient Details</h5>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Age</label>
          <input type="number" class="form-control" [(ngModel)]="patient.age" name="age">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Gender</label>
          <select class="form-select" [(ngModel)]="patient.gender" name="gender">
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" [(ngModel)]="patient.address" name="address" rows="2"></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-success px-4" [disabled]="!editPatientForm.valid">Update</button>
      </div>

    </form>
  </div>
</div>
