<div class="container mt-4">
  <h2 class="text-center mb-4">Add Patient</h2>

  <form (ngSubmit)="onSubmit()" #patientForm="ngForm" class="card p-4 shadow-sm rounded">

    <!-- User Information -->
    <h5 class="mb-3 text-primary">User Details</h5>

    <div class="mb-3">
      <label class="form-label"><b>Name:</b></label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="patient.user.name"
        name="name"
        required
        placeholder="Enter full name"
      />
    </div>

    <div class="mb-3">
      <label class="form-label"><b>Email:</b></label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="patient.user.email"
        name="email"
        required
        placeholder="Enter email address"
      />
    </div>

    <div class="mb-3">
      <label class="form-label"><b>Password:</b></label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="patient.user.password"
        name="password"
        required
        placeholder="Enter password"
      />
    </div>

    <hr />

    <!-- 🩺 Patient Information -->
    <h5 class="mb-3 text-primary">Patient Details</h5>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label"><b>Gender:</b></label>
        <select
          class="form-select"
          [(ngModel)]="patient.gender"
          name="gender"
          required
        >
          <option value="">Select gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label"><b>Age:</b></label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="patient.age"
          name="age"
          required
          placeholder="Enter age"
        />
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label"><b>Phone:</b></label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="patient.phone"
        name="phone"
        required
        placeholder="Enter phone number"
      />
    </div>

    <div class="mb-3">
      <label class="form-label"><b>Medical History:</b></label>
      <textarea
        class="form-control"
        [(ngModel)]="patient.medicalHistory"
        name="medicalHistory"
        rows="2"
        placeholder="Enter past medical details"
      ></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label"><b>Address:</b></label>
      <textarea
        class="form-control"
        [(ngModel)]="patient.address"
        name="address"
        rows="2"
        placeholder="Enter address"
      ></textarea>
    </div>

    <div class="text-center">
      <button
        type="submit"
        class="btn btn-success px-4"
        [disabled]="!patientForm.valid"
      >
        Add Patient
      </button>
    </div>
  </form>
</div>
