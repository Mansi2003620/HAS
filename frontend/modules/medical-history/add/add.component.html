<div class="medical-history-page">
  <div class="medical-history-container">
    <div class="medical-history-card">
      <h2>Add Medical History</h2>

      <form (ngSubmit)="onSubmit()" #historyForm="ngForm">
        <div class="form-group mb-3">
          <label for="diagnosis">Diagnosis</label>
          <input
            type="text"
            id="diagnosis"
            class="form-control"
            [(ngModel)]="history.diagnosis"
            name="diagnosis"
            required
          />
        </div>

        <div class="form-group mb-3">
          <label for="notes">Notes</label>
          <textarea
            id="notes"
            class="form-control"
            [(ngModel)]="history.notes"
            name="notes"
            required
          ></textarea>
        </div>

        <div class="form-group mb-3">
          <label for="recorddate">Record Date</label>
          <input
            type="date"
            id="recorddate"
            class="form-control"
            [(ngModel)]="history.recorddate"
            name="recorddate"
            required
          />
        </div>

        <button type="submit" class="btn" [disabled]="!historyForm.valid">
          Add Medical History
        </button>
        <button
          type="button"
          class="btn btn-secondary ms-2"
          (click)="router.navigate(['/medical-history/list', patientId])"
        >
          Cancel
        </button>
      </form>
    </div>
  </div>
</div>
